name: Collect & Draft Articles

# README「3. 情報収集フロー」の scrape〜publish-drafts(1〜5)を自動実行し、
# data/news.json / data/drafts/articles.json を main へ直接コミットする
# (push to main で deploy.yml が発火し自動デプロイされる)。

on:
  schedule:
    - cron: "0 22 * * *" # JST 7:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Scrape
        run: pnpm scrape

      - name: Extract
        run: pnpm extract
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Dedupe & link
        run: pnpm dedupe-and-link
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Generate article bodies
        run: pnpm generate-articles
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Publish drafts
        run: pnpm publish-drafts

      - name: Commit published news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/drafts/articles.json
          git diff --cached --quiet && echo "変更無し" && exit 0
          git commit -m "chore: 記事公開 (collect-articles)"
          git push
