name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # 日付特集(今日/今週末/今月のイベント等)はビルド時点の日付で生成されるため日次で再ビルドする。
  # collect-articles のGITHUB_TOKENによるpushではこのworkflowが発火しないため、収集後にも実行する
  schedule:
    - cron: "5 15 * * *" # JST 0:05
    - cron: "0 23 * * *" # JST 8:00 (collect-articles 完了後)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
